# audio-priority config — installed to ~/.config/audio-priority/priority.conf
#
# The first device in each list that is currently connected becomes the system
# default, so exactly one output and one input are active at a time.
# Patterns: `bluetooth` (any BT device), `uid:<UID>` (exact), or a
# case-insensitive name substring (extra spaces ignored). Run
# `audio-priority --list` to see names/UIDs. Changes are picked up on the next
# device change, or right away with `audio-priority --once`.

# Output: headphones when connected, else the desk DAC (WooAudio at home,
# O2/ODAC at work — never both at once), else laptop speakers.
# Monitors (LG, Odyssey), Multi-Output, BlackHole, and Loopback devices are never chosen.
output: bluetooth
output: WooAudio
output: ODAC
output: MacBook Pro Speakers

# Input: Plugable interface (work), else USB codec (home), else headphones,
# else the laptop mic.
# "USB Audio CODEC" matches both "USB AUDIO  CODEC" (home) and "USB Audio CODEC "
# (seen at work), but not "Plugable USB Audio Device".
# Note: using the Bluetooth mic switches headphones into call (HFP) mode, so
# playback quality drops while it's the active input.
input: Plugable
input: USB Audio CODEC
input: bluetooth
input: MacBook Pro Microphone
