[[on-window-detected]]
if.app-id = "com.cisco.Secure-Client"
run = "layout floating"

[[on-window-detected]]
if.app-id = "com.cisco.anyconnect.gui"
run = "layout floating"

[[on-window-detected]]
if.app-id = "com.cisco.anyconnect.macos"
run = "layout floating"

[[on-window-detected]]
if.app-name-regex-substring = 'Cisco Secure Client'
run = 'layout floating'

# Zoom meeting on top of zoom workplace
[[on-window-detected]]
if.app-name-regex-substring = 'zoom\.us'
if.window-title-regex-substring = 'Zoom Meeting'
run = 'fullscreen'

