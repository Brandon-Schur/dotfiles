# HOME
## 1 | Built-in Retina Display
## 2 | Odyssey G7
## 3 | LG HDR QHD

[workspace-to-monitor-force-assignment]
1 = 1
2 = 2
3 = 3
4 = 1
5 = 2
6 = 3
7 = 1
8 = 2
9 = 3
10 = 1
11 = 2
12 = 3

