# -----------------------------------------------------------------------------
# Workspace 9 = "parking" workspace for infrequently reviewed but necessary
# windows. They are TILED IN A GRID (not floating, not accordion) so every one
# is visible at a glance: 4 windows -> 2x2, 6 -> 3x2, 3 -> 2+1, etc.
# Members: Cisco VPN, Zoom (non-meeting windows), and Wisp transcripts.
#
# AeroSpace has no native grid layout, so grid-workspace.sh builds one
# (root h_tiles with one v_tiles column per grid column). It runs:
#   - after each parking rule below (new window detected), and
#   - from on-focus-changed / exec-on-workspace-change with --if-changed, so
#     the grid re-flows when a parked window closes or is moved in/out.
# Manual re-grid: alt-shift-g. 'layout tiling' guarantees the window isn't
# floating (floating windows are left out of the grid).
# -----------------------------------------------------------------------------

# Cisco Secure Client / AnyConnect VPN -> parked in the workspace 9 grid
[[on-window-detected]]
if.app-id = "com.cisco.secureclient.gui"
run = ['move-node-to-workspace 9', 'layout tiling', 'exec-and-forget /bin/bash /Users/bschur/.config/aerospace/grid-workspace.sh 9']

[[on-window-detected]]
if.app-id = "com.cisco.Secure-Client"
run = ['move-node-to-workspace 9', 'layout tiling', 'exec-and-forget /bin/bash /Users/bschur/.config/aerospace/grid-workspace.sh 9']

[[on-window-detected]]
if.app-id = "com.cisco.anyconnect.gui"
run = ['move-node-to-workspace 9', 'layout tiling', 'exec-and-forget /bin/bash /Users/bschur/.config/aerospace/grid-workspace.sh 9']

[[on-window-detected]]
if.app-id = "com.cisco.anyconnect.macos"
run = ['move-node-to-workspace 9', 'layout tiling', 'exec-and-forget /bin/bash /Users/bschur/.config/aerospace/grid-workspace.sh 9']

[[on-window-detected]]
if.app-name-regex-substring = 'Cisco Secure Client'
run = ['move-node-to-workspace 9', 'layout tiling', 'exec-and-forget /bin/bash /Users/bschur/.config/aerospace/grid-workspace.sh 9']

# Flameshot capture overlay must float (never tiled) so it can cover the screen
[[on-window-detected]]
if.app-id = 'org.flameshot.Flameshot'
run = 'layout floating'

# Zoom MEETING window -> workspace 2, tiled SIDE-BY-SIDE (h_tiles) as the LEFT window.
# Listed BEFORE the general Zoom rule on purpose: AeroSpace runs only the FIRST
# matching on-window-detected callback, so this specific title match wins and
# the "park on 9" rule below is skipped for meeting windows.
# NOTE: Zoom's bundle id is us.zoom.xos (list-windows shows app-name "Zoom").
# Zoom usually sets the "Zoom Meeting" title AFTER the window appears, so this
# rule often misses; zoom-route.sh (called from the rule below) catches those.
[[on-window-detected]]
if.app-id = 'us.zoom.xos'
if.window-title-regex-substring = 'Zoom Meeting'
run = ['move-node-to-workspace 2', 'layout tiling', 'layout h_tiles', 'exec-and-forget /bin/bash /Users/bschur/.config/aerospace/zoom-route.sh']

# Any other Zoom window (e.g. "Zoom Workplace" / main window) -> parked on 9.
# zoom-route.sh then watches the title for a few seconds and re-routes the
# window to workspace 2 (h_tiles) if it turns out to be a meeting.
[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = ['move-node-to-workspace 9', 'layout tiling', 'exec-and-forget /bin/bash /Users/bschur/.config/aerospace/zoom-route.sh']

# Wisp transcripts -> parked & tiled on workspace 9 (alongside VPN + Zoom)
[[on-window-detected]]
if.app-name-regex-substring = 'Wisp'
run = ['move-node-to-workspace 9', 'layout tiling', 'exec-and-forget /bin/bash /Users/bschur/.config/aerospace/grid-workspace.sh 9']

# =============================================================================
#
# App -> Workspace Mappings
# Every new window of these apps opens on its home workspace. Snapshot of where
# apps lived on 2026-09-28. VPN/Zoom/Wisp are handled in the rules above.
# Find an app's id with: aerospace list-windows --all --format '%{app-bundle-id} | %{app-name}'
# app-id is an EXACT match, so the Vivaldi "Dashboard" web app (its own id)
# is not caught by the plain Vivaldi rule.
#
# =============================================================================

# Workspace 1 — Slack
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 1'

# Workspace 2 — Vivaldi (main browser)
[[on-window-detected]]
if.app-id = 'com.vivaldi.Vivaldi'
run = 'move-node-to-workspace 2'

# Workspace 3 — Alacritty. Only the FIRST terminal is sent to 3. Extra
# terminals (alt-shift-enter) stay on the workspace they were opened from.
[[on-window-detected]]
if.app-id = 'org.alacritty'
run = 'exec-and-forget /bin/bash /Users/bschur/.config/aerospace/first-window-to-workspace.sh org.alacritty 3'

# Workspace 5 — Outlook + Vivaldi "Dashboard" web app
[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.vivaldi.Vivaldi.app.mcijphhnflbofdapglafogoladjmgfge'
run = 'move-node-to-workspace 5'

# Workspace 7 — Spotify
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 7'

# Obsidian — intentionally NOT mapped (moved by hand). To pin it, uncomment
# and set the workspace number:
# [[on-window-detected]]
# if.app-id = 'md.obsidian'
# run = 'move-node-to-workspace 4'

