# Start AeroSpace at login
start-at-login = true
config-version = 2
after-startup-command = ['exec-and-forget sketchybar']

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Layout settings
accordion-padding = 0
default-root-container-layout = 'tiles' # 'accordion' stacks windows on top of each other; overlap only via fullscreen (alt-f / ctrl-f)
default-root-container-orientation = 'auto'

# Mouse follows focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Sketchybar (Efterklang config) : notify on workspace focus change
exec-on-workspace-change = ['/bin/bash', '-c', '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE; /bin/bash /Users/bschur/.config/aerospace/grid-workspace.sh 9 --if-changed']

# Sketchybar : notify on window focus change (drives the focused-window state icon)
# NOTE: AeroSpace callbacks run with a minimal PATH, so call sketchybar by absolute path.
# Also re-grid workspace 9 if its set of windows changed (no-op otherwise).
on-focus-changed = ['exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_focus_change', 'exec-and-forget /bin/bash /Users/bschur/.config/aerospace/grid-workspace.sh 9 --if-changed']

# Sketchybar : notify on binding-mode change (drives the mode indicator)
on-mode-changed = ['exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=$AEROSPACE_MODE']

# Persistent workspaces 1-12
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

# Disable macOS hide app (prevents accidental cmd-h)
automatically-unhide-macos-hidden-apps = false

# Gaps between windows
[gaps]
inner.horizontal = 5
inner.vertical =   5
outer.left =       5
outer.bottom =     5
# Small top gap on the built-in only; the notch/menu-bar strip (where Sketchybar
# draws) is already excluded from tiling. Externals stay full-height.
# If windows overlap the bar once it's running, bump the built-in value up.
outer.top = [{ monitor."built-in" = 5 }, 0]
outer.right =      5

[mode.main.binding]
# terminal
alt-shift-enter = 'exec-and-forget open -n /Applications/Alacritty.app'
alt-q = 'close'

# Flameshot screenshot — macOS has no built-in Flameshot global hotkey, so bind one here.
# ctrl-shift-4: full capture GUI (annotate, then save/copy via the toolbar buttons — in-overlay
#   keyboard shortcuts like Ctrl+C do NOT work on macOS, see flameshot issue #1897, so use the mouse toolbar).
# Both go through capture.sh, which first kills any hung (invisible) capture so the hotkey never gets stuck.
ctrl-shift-4 = 'exec-and-forget /bin/bash /Users/bschur/.config/flameshot/capture.sh --path /Users/bschur/Photos/Screenshots'
# ctrl-shift-` : quick grab — drag a region and on release it is copied to the clipboard and the overlay closes.
ctrl-shift-backtick = 'exec-and-forget /bin/bash /Users/bschur/.config/flameshot/capture.sh --accept-on-select --clipboard'

# Wisp Transcript Session (long-form) — Wisp 2.9 removed its shortcut, so alt-shift-e clicks the
# menu bar item to start/stop a session. Sits next to Wisp's own dictate key (alt-e).
# NOTE: the physical key press is caught by Karabiner-Elements (~/.config/karabiner/karabiner.json,
# rule "Wisp transcript session"), which runs 'aerospace trigger-binding --mode main alt-shift-e'.
# Pressed directly, the key never reached AeroSpace unless a Wisp window was open. Karabiner sees
# keys before any app, so this works globally. The osascript still runs under AeroSpace's permissions.
alt-shift-e = 'exec-and-forget /usr/bin/osascript /Users/bschur/.config/aerospace/wisp-transcript-session.applescript'

# Re-grid the workspace 9 parking area on demand
alt-shift-g = 'exec-and-forget /bin/bash /Users/bschur/.config/aerospace/grid-workspace.sh 9'

# Focus windows with alt + h/j/k/l
ctrl-shift-h = 'focus --boundaries all-monitors-outer-frame left'
ctrl-shift-j = 'focus --boundaries all-monitors-outer-frame down'
ctrl-shift-k = 'focus --boundaries all-monitors-outer-frame up'
ctrl-shift-l = 'focus --boundaries all-monitors-outer-frame right'

# swap windows
ctrl-shift-left  = 'move --boundaries all-monitors-outer-frame left'
ctrl-shift-down  = 'move --boundaries all-monitors-outer-frame down'
ctrl-shift-up    = 'move --boundaries all-monitors-outer-frame up'
ctrl-shift-right = 'move --boundaries all-monitors-outer-frame right'

# resize
ctrl-cmd-left = 'resize width -50' #left
ctrl-cmd-right = 'resize width +50' #right
ctrl-cmd-up = 'resize height +50'
ctrl-cmd-down = 'resize height -50'

# Workspaces: win + 1-9 to switch
ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'
ctrl-3 = 'workspace 3'
ctrl-4 = 'workspace 4'
ctrl-5 = 'workspace 5'
ctrl-6 = 'workspace 6'
ctrl-7 = 'workspace 7'
ctrl-8 = 'workspace 8'
ctrl-9 = 'workspace 9'

# Move to workspace: ctrl + 1-9
alt-1 = 'move-node-to-workspace 1'
alt-2 = 'move-node-to-workspace 2'
alt-3 = 'move-node-to-workspace 3'
alt-4 = 'move-node-to-workspace 4'
alt-5 = 'move-node-to-workspace 5'
alt-6 = 'move-node-to-workspace 6'
alt-7 = 'move-node-to-workspace 7'
alt-8 = 'move-node-to-workspace 8'
alt-9 = 'move-node-to-workspace 9'

# move workspace left or right
alt-shift-a = 'move-workspace-to-monitor --wrap-around prev'
alt-shift-s = 'move-workspace-to-monitor --wrap-around next'

# next/prev workspace
ctrl-w = 'workspace next'
ctrl-q = 'workspace prev'

ctrl-shift-w = 'move-node-to-workspace next'
ctrl-shift-q = 'move-node-to-workspace prev'

# Utilities
ctrl-shift-z = 'close'
alt-tab = 'workspace-back-and-forth'
alt-f = ['fullscreen', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_focus_change']
ctrl-f = ['fullscreen', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_focus_change']
alt-shift-t = ['layout floating tiling', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_focus_change']
ctrl-t = ['layout floating tiling', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_focus_change']
alt-v = ['layout tiles horizontal vertical', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_focus_change']
ctrl-v = ['layout tiles horizontal vertical', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_focus_change']


