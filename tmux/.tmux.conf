# ~/.tmux.conf
# Tokyo Night Storm color palette over catppuccin's layout.
# Plugins managed via TPM — run install.sh or press <prefix> I on first launch.

# -- prefix --------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind a send-prefix

# -- general -------------------------------------------------------------------
set -g base-index 1              # windows start at 1
setw -g pane-base-index 1        # panes start at 1
set -g renumber-windows on       # renumber windows when one closes
set -s set-clipboard on          # OSC 52 clipboard passthrough
# Advertise OSC 52 clipboard capability for Alacritty (tmux only enables it
# for xterm* by default). Remove/adjust for other terminals if needed.
set -as terminal-features ",alacritty:clipboard"
set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g mouse on

# -- copy mode (vi) ------------------------------------------------------------
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -- panes / splits / resize ---------------------------------------------------
unbind ^A
bind ^A select-pane -t :.+
unbind %
bind | split-window -h
bind - split-window -v
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5

# -- windows -------------------------------------------------------------------
bind -r n next-window
bind -r N previous-window

# -- sessions ------------------------------------------------------------------
# session picker sorted by name with 1-indexed selection keys
bind s choose-tree -ZsK '#{?#{e|<:#{line},9},#{e|+:1,#{line}},#{?#{e|<:#{line},35},M-#{a:#{e|+:97,#{e|-:#{line},9}}},}}'

# -- misc ----------------------------------------------------------------------
# capture the whole pane scrollback to ~/.tmux.log with <prefix> e
bind e capture-pane -b tmp-capture-buffer -S - \; save-buffer -b tmp-capture-buffer ~/.tmux.log \; delete-buffer -b tmp-capture-buffer

# -- plugins (TPM) -------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# -- catppuccin (v2) -----------------------------------------------------------
set -g @catppuccin_flavor 'frappe'           # only used as fallback; palette below overrides
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_directory_text '#{pane_current_path}'
set -g @catppuccin_date_time_text '%Y-%m-%d %I:%M %p'

# -- Tokyo Night (Storm) palette override --------------------------------------
# catppuccin's flavor files use `set -ogq` (only-if-unset), so defining @thm_*
# here BEFORE `run tpm` makes catppuccin use these colors for everything.
# Source: folke/tokyonight.nvim lua/tokyonight/colors/storm.lua
set -g @thm_crust     "#1b1e2d"
set -g @thm_mantle    "#1f2335"
set -g @thm_bg        "#24283b"
set -g @thm_surface_0 "#292e42"
set -g @thm_surface_1 "#3b4261"
set -g @thm_surface_2 "#414868"
set -g @thm_overlay_0 "#545c7e"
set -g @thm_overlay_1 "#565f89"
set -g @thm_overlay_2 "#737aa2"
set -g @thm_subtext_0 "#737aa2"
set -g @thm_subtext_1 "#a9b1d6"
set -g @thm_fg        "#c0caf5"
set -g @thm_rosewater "#b4f9f8"
set -g @thm_flamingo  "#89ddff"
set -g @thm_pink      "#ff007c"
set -g @thm_mauve     "#bb9af7"
set -g @thm_red       "#f7768e"
set -g @thm_maroon    "#db4b4b"
set -g @thm_peach     "#ff9e64"
set -g @thm_yellow    "#e0af68"
set -g @thm_green     "#9ece6a"
set -g @thm_teal      "#1abc9c"
set -g @thm_sky       "#7dcfff"
set -g @thm_sapphire  "#2ac3de"
set -g @thm_blue      "#7aa2f7"
set -g @thm_lavender  "#89ddff"

# Initialize TPM — must stay near the bottom, before status-line module refs
run '~/.tmux/plugins/tpm/tpm'

# -- status line ---------------------------------------------------------------
# Built AFTER `run tpm` so catppuccin status modules are defined.
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_user}"

# -- fix: catppuccin/tmux #600 (tmux 3.7) --------------------------------------
# In tmux 3.7 `align=centre` in message-style no longer fills the status bar,
# so the command prompt doesn't cover window tabs. `fill=` restores it.
set -gF message-style "fg=#{@thm_teal},bg=#{@thm_overlay_0},fill=#{@thm_overlay_0}"
set -gF message-command-style "fg=#{@thm_teal},bg=#{@thm_overlay_0},fill=#{@thm_overlay_0}"
