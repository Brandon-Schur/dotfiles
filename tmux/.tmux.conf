# ~/.tmux.conf
# Tokyo Night Storm color palette over catppuccin's layout.
# Plugins managed via TPM — run install.sh or press <prefix> I on first launch.

# -- prefix --------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind a send-prefix

# -- general -------------------------------------------------------------------
set -g base-index 1              # windows start at 1
setw -g pane-base-index 1        # panes start at 1
set -g renumber-windows on       # renumber windows when one closes
set -s set-clipboard on          # OSC 52 clipboard passthrough
# Advertise OSC 52 clipboard capability for Alacritty (tmux only enables it
# for xterm* by default). Remove/adjust for other terminals if needed.
set -as terminal-features ",alacritty:clipboard"
set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g mouse on

# -- copy mode (vi) ------------------------------------------------------------
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -- panes / splits / resize ---------------------------------------------------
unbind ^A
bind ^A select-pane -t :.+
unbind %
bind | split-window -h
bind - split-window -v
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5

# -- windows -------------------------------------------------------------------
bind -r n next-window
bind -r N previous-window

# -- sessions ------------------------------------------------------------------
# session picker sorted by name with 1-indexed selection keys
bind s choose-tree -ZsK '#{?#{e|<:#{line},9},#{e|+:1,#{line}},#{?#{e|<:#{line},35},M-#{a:#{e|+:97,#{e|-:#{line},9}}},}}'

# -- misc ----------------------------------------------------------------------
# capture the whole pane scrollback to ~/.tmux.log with <prefix> e
bind e capture-pane -b tmp-capture-buffer -S - \; save-buffer -b tmp-capture-buffer ~/.tmux.log \; delete-buffer -b tmp-capture-buffer

# -- plugins (TPM) -------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# -- catppuccin (v2) -----------------------------------------------------------
set -g @catppuccin_flavor 'frappe'           # only used as fallback; palette below overrides
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_directory_text '#{pane_current_path}'
set -g @catppuccin_date_time_text '%Y-%m-%d %I:%M %p'
# active-window number badge: catppuccin defaults this to @thm_mauve (purple).
# The lighter brand cyan marks the selected window. Must be set before `run tpm`
# because catppuccin bakes it into the window-status format at load time.
set -g @catppuccin_window_current_number_color "#{@thm_sapphire}"
# Reduce grey in the window pills — recolor the badges/backgrounds with blues
# instead of catppuccin's default greys. The lighter brand cyan marks the ACTIVE
# window; inactive number badges use the deeper royal blue; the window-name
# backgrounds become navy tints rather than grey.
set -g @catppuccin_window_number_color "#{@thm_blue}"      # inactive # badge: royal blue
set -g @catppuccin_window_current_text_color "#2e4a73"     # active name bg: royal navy
set -g @catppuccin_window_text_color "#233043"             # inactive name bg: dark navy

# -- bschur_custom palette override --------------------------------------------
# Keep catppuccin's status layout/modules but remap its palette to the
# bschur_custom dark-mode scheme. catppuccin's flavor files set @thm_* with
# `set -ogq` (only-if-unset), so defining them here BEFORE `run tpm` makes
# catppuccin build every style from these values. (@catppuccin_flavor above is
# therefore irrelevant for colors.) Matches the tokyonight "storm" bschur_custom
# override in Neovim (~/.config/nvim/lua/plugins/tokyonight.lua) and
# alacritty/bschur_custom.toml.
# backgrounds / surfaces (darkest -> lightest)
set -g @thm_crust     "#12171c"
set -g @thm_mantle    "#191e24"
set -g @thm_bg        "#1e252f"
set -g @thm_surface_0 "#232c3a"
set -g @thm_surface_1 "#374151"
set -g @thm_surface_2 "#4b5563"
set -g @thm_overlay_0 "#5d6a85"
set -g @thm_overlay_1 "#70819a"
set -g @thm_overlay_2 "#8a96ad"
set -g @thm_subtext_0 "#9fabc1"
set -g @thm_subtext_1 "#bdc4d5"
set -g @thm_fg        "#dee3ea"
# accents
set -g @thm_rosewater "#d6e6ff"
set -g @thm_flamingo  "#bbd6fe"
set -g @thm_pink      "#e0559a"
set -g @thm_mauve     "#b48ef0"
set -g @thm_red       "#f76a86"
set -g @thm_maroon    "#ef405e"
set -g @thm_peach     "#f0a35e"
set -g @thm_yellow    "#fccf54"
set -g @thm_green     "#34d399"
set -g @thm_teal      "#2dd4bf"
set -g @thm_sky       "#5cc6ef"
set -g @thm_sapphire  "#29b5e8"
set -g @thm_blue      "#5999f8"
set -g @thm_lavender  "#85a9f8"

# Initialize TPM — must stay near the bottom, before status-line module refs
run '~/.tmux/plugins/tpm/tpm'

# -- status line ---------------------------------------------------------------
# Built AFTER `run tpm` so catppuccin status modules are defined.
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_user}"

# -- fix: catppuccin/tmux #600 (tmux 3.7) --------------------------------------
# In tmux 3.7 `align=centre` in message-style no longer fills the status bar,
# so the command prompt doesn't cover window tabs. `fill=` restores it.
set -gF message-style "fg=#{@thm_teal},bg=#{@thm_overlay_0},fill=#{@thm_overlay_0}"
set -gF message-command-style "fg=#{@thm_teal},bg=#{@thm_overlay_0},fill=#{@thm_overlay_0}"


# -- pane borders --------------------------------------------------------------
# catppuccin colors the ACTIVE pane border from @thm_lavender (a light purple/
# periwinkle). Remap it to the royal blue. Set after `run tpm` so it overrides
# catppuccin's values. Brand cyan is used for copy-mode / synchronized panes so
# those states stay distinguishable.
setw -g pane-border-style "fg=#{@thm_overlay_0}"
setw -g pane-active-border-style "#{?pane_in_mode,fg=#{@thm_sapphire},#{?pane_synchronized,fg=#{@thm_sapphire},fg=#{@thm_blue}}}"
